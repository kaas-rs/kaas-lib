[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/testkit",
    "crates/testkit-macros",
    "crates/kafka-conn",
    "crates/kafka-meta",
    "crates/kafka-admin",
    "crates/kafka-read",
    "crates/kafka-produce",
    "crates/kafka-consume",
    "crates/livetest",
]

[workspace.package]
# The six published crates release in lockstep: they are one library split
# along a layering boundary, not six independently useful things, and a
# caller pulling kafka-admin 0.2 against kafka-conn 0.1 is not a
# combination anyone tests. Bump here, not per crate.
version      = "0.8.0"
edition      = "2024"
license      = "Apache-2.0"
repository   = "https://github.com/kaas-rs/kaas-lib"
homepage     = "https://kaas-rs.github.io/kaas-lib/"
rust-version = "1.97"

[workspace.dependencies]
# The published crates depending on each other. Here rather than inline in
# six manifests because a `cargo publish` dependency requirement is not
# inherited from `[workspace.package] version` — it is a separate string that
# has to be bumped in lockstep, and getting it wrong is not caught by any
# local check. It fails partway through a six-crate publish, after some
# crates are already live and irreversibly so, with a resolver error about a
# version that does not exist yet.
#
# So: three adjacent lines in one file, not a scattering across six manifests.
# Bump these together with `[workspace.package] version` above.
#
# `kafka-read` is here because `kafka-consume` takes the tolerant decoder from
# it rather than building a second one. It was pinned inline at 0.2.1 instead,
# which is precisely the failure this block exists to prevent: it survived
# `cargo xtask ci` untouched and surfaced at the 0.3.0 bump.
kafka-conn = { path = "crates/kafka-conn", version = "0.8.0" }
kafka-meta = { path = "crates/kafka-meta", version = "0.8.0" }
kafka-read = { path = "crates/kafka-read", version = "0.8.0" }

# The codec, and the only place protocol types are allowed to appear.
# See CLAUDE.md: `client` drops the broker half of the codegen, and
# `messages_enums` is not in `default` but is what the read-only gate
# and generic dispatch match on.
kafka-protocol = { version = "0.17", default-features = false, features = [
    "client",
    "messages_enums",
    "gzip",
    "snappy",
    "lz4",
    "zstd",
] }

# async + I/O
tokio        = { version = "1.53", features = ["full"] }
tokio-util   = { version = "0.7", features = ["codec", "io"] }
futures      = "0.3"
bytes        = "1.12"
arc-swap     = "1.9"

# TLS. `ring` rather than the default `aws_lc_rs` provider: aws-lc-sys needs
# cmake and a C toolchain at build time, and CI already lost time to exactly
# that on a minimal runner image. `ring` builds with cc alone.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
rustls-pemfile      = "2.2"

# SASL. `stringprep` is the SASLprep requirement from CLAUDE.md — a
# hand-rolled trim-and-lowercase silently fails on non-ASCII passwords
# that a Java client accepts. The RustCrypto set is version-coherent:
# hmac 0.13 / sha2 0.11 / pbkdf2 0.13 all sit on digest 0.11.
stringprep = "0.1"
hmac       = "0.13"
sha2       = "0.11"
pbkdf2     = "0.13"
base64     = "0.23"
subtle     = "2.6"
rand       = "0.9"

# OAUTHBEARER: RFC 7628's failure challenge and OIDC's token response are both
# JSON. Pure Rust, no build script, and the one JSON reader in the workspace —
# two ways to parse JSON in one crate is worse than the dependency.
serde_json = "1.0"

# The OIDC token endpoint (KIP-768), behind kafka-conn's `oidc` feature. hyper
# rather than reqwest because the TLS stack has to stay `ring`: reqwest's rustls
# features reach for the default provider, which is aws-lc-sys, which needs
# cmake — the exact toolchain the `ring` choice above exists to avoid.
hyper           = { version = "1.8", features = ["client", "http1"] }
hyper-util      = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# No root-store feature: the rustls config is built by our own `TlsConfig`, so
# the trust anchors — and the explicitly-named `ring` provider — come from the
# one place that already decides what this process trusts.
hyper-rustls    = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "logging",
] }
http-body-util  = "0.1"
form_urlencoded = "1.2"

# Bounded decompression for the read path. These are the same crates
# `kafka-protocol` uses; we take them directly so a batch can be decompressed
# through a `Read` we can `take()`, which is the only way to stop a hostile
# producer's 1 KiB batch from becoming a 1 GiB allocation. Snappy is the
# exception — see kafka-read/src/decompress.rs.
# `Fetch` v13+ identifies topics by uuid; `kafka-protocol` uses this crate for
# the type, so we need it to construct one.
uuid   = "1"
flate2 = "1.1"
lz4    = "1.28"
zstd   = "0.13"

# errors / observability
thiserror          = "2.0"
anyhow             = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics            = "0.24"

# tests
testcontainers = "0.27"

[workspace.lints.clippy]
# Rule 2: a malformed record from one topic must not take down a server
# hosting other clusters. Denied at the workspace root so a new crate
# inherits it by opting in with `[lints] workspace = true` rather than
# by remembering to repeat the attributes.
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
indexing_slicing         = "deny"
as_conversions           = "deny"
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"
