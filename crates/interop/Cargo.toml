# Deliberately excluded from the workspace.
#
# `rdkafka` builds librdkafka from C source and wants cmake and a C toolchain.
# That is a fine thing to require of a job whose whole point is cross-client
# interoperability, and a terrible thing to require of `cargo xtask ci` — CI on
# a minimal runner image has already been red once over exactly this. So this
# crate stands alone and is built by `cargo xtask interop`.
[package]
name    = "interop"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
kafka-read    = { path = "../kafka-read" }
kafka-admin   = { path = "../kafka-admin" }
kafka-conn    = { path = "../kafka-conn" }
kafka-produce = { path = "../kafka-produce" }
kafka-consume = { path = "../kafka-consume" }
testkit     = { path = "../testkit" }
tokio       = { version = "1.53", features = ["full"] }
futures     = "0.3"
bytes       = "1.12"
# `zstd` explicitly: rdkafka-sys configures librdkafka with -DWITH_ZSTD=0
# unless the feature is on, and the zstd interop case then fails at *client
# construction* with `Unsupported value "zstd" for configuration property
# "compression.codec": libzstd not available at build time`. A producer that
# cannot produce zstd cannot prove we read zstd, which is the whole point of
# that case.
#
# `ssl` for the same reason one step further out: without it librdkafka is
# built `WITH_SSL 0`, and it needs OpenSSL for SCRAM's and OAUTHBEARER's HMAC,
# so `WITH_SASL_SCRAM 0` and `WITH_SASL_OAUTHBEARER 0` follow. The one suite
# whose whole purpose is "do we agree with a genuinely different client" then
# cannot speak to authentication at all — which is a strange gap for the
# mechanism where a subtle disagreement (SASLprep, the proof, the extension
# list) is invisible until it is a production login failure. It costs
# `libssl-dev` on the runner, which the interop job already installs.
rdkafka     = { version = "0.38", features = ["cmake-build", "zstd", "ssl"] }

[workspace]
