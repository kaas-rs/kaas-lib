[package]
name        = "kafka-read"
description = "Kafka 4.x read path: streaming forward scans and backward tails with tolerant record decoding"
readme      = "README.md"
keywords    = ["kafka", "consumer", "fetch", "records", "async"]
categories  = ["network-programming", "asynchronous"]

version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
kafka-conn     = { path = "../kafka-conn", version = "0.0.1" }
kafka-meta     = { path = "../kafka-meta", version = "0.0.1" }
kafka-protocol = { workspace = true }
tokio          = { workspace = true }
futures        = { workspace = true }
bytes          = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
anyhow         = { workspace = true }
uuid           = { workspace = true }
flate2         = { workspace = true }
lz4            = { workspace = true }
zstd           = { workspace = true }
# Raw, unframed snappy — the framing `librdkafka` writes and the one
# `kafka-protocol` 0.17 cannot decode. See `decompress::snappy`.
snap           = "1.1"

[dev-dependencies]
testkit            = { path = "../testkit" }
kafka-admin        = { path = "../kafka-admin" }
tokio              = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
