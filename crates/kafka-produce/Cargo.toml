[package]
name        = "kafka-produce"
description = "Kafka 4.x write path: record batch encoding, murmur2 and sticky partitioning, acknowledged produce"
readme      = "README.md"
keywords    = ["kafka", "producer", "produce", "records", "async"]
categories  = ["network-programming", "asynchronous"]

version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
kafka-conn     = { workspace = true }
kafka-meta     = { workspace = true }
kafka-protocol = { workspace = true }
tokio          = { workspace = true }
bytes          = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
# The sticky partitioner's initial pick. Random rather than "always partition
# zero", so N producers on one topic do not pile onto the same partition.
rand           = { workspace = true }

[dev-dependencies]
testkit            = { path = "../testkit" }
kafka-admin        = { path = "../kafka-admin" }
kafka-read         = { path = "../kafka-read" }
futures            = { workspace = true }
tokio              = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
