[package]
name        = "kafka-produce"
description = "Kafka 4.x write path: record batch encoding, murmur2 and sticky partitioning, acknowledged produce"
readme      = "README.md"
keywords    = ["kafka", "producer", "produce", "records", "async"]
categories  = ["network-programming", "asynchronous"]

version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
kafka-conn     = { workspace = true }
kafka-meta     = { workspace = true }
kafka-protocol = { workspace = true }
tokio          = { workspace = true }
bytes          = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
# `join_all` over one send per leader: the batches bound for different brokers
# in one dispatch have no reason to wait for each other.
futures        = { workspace = true }
# The sticky partitioner's initial pick. Random rather than "always partition
# zero", so N producers on one topic do not pile onto the same partition.
rand           = { workspace = true }

[dev-dependencies]
testkit            = { path = "../testkit" }
kafka-admin        = { path = "../kafka-admin" }
kafka-read         = { path = "../kafka-read" }
# KIP-447's acceptance test needs a real consumer to take offsets from, and the
# issue's acceptance command names this crate's test. Cargo permits the
# dev-dependency cycle with `kafka-consume` (which dev-depends on this crate to
# get records to read), and both edges are path-only, so `cargo publish` strips
# them rather than trying to resolve a cycle.
kafka-consume      = { path = "../kafka-consume" }
futures            = { workspace = true }
tokio              = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
