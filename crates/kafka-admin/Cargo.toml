[package]
name        = "kafka-admin"
description = "Kafka 4.x admin client: topics, configs, offsets, groups, ACLs, quotas and partitions, with per-resource results"
readme      = "README.md"
keywords    = ["kafka", "admin", "adminclient", "client", "async"]
categories  = ["network-programming", "asynchronous", "api-bindings"]

version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[dependencies]
kafka-conn     = { workspace = true }
kafka-meta     = { workspace = true }
kafka-protocol = { workspace = true }
tokio          = { workspace = true }
futures        = { workspace = true }
bytes          = { workspace = true }
# A delegation token's HMAC is a SASL password once base64-encoded, and that
# encoding is the link between issuing a token and authenticating with one.
base64         = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
testkit            = { path = "../testkit" }
tokio              = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
