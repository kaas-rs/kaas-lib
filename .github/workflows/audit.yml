name: Audit

# Dependency-advisory checking for a *published* library (#33). CI proves the
# code works; nothing there notices when RUSTSEC publishes an advisory against
# a crate already in the tree — that can happen the day after a release, which
# is why the schedule exists and is the real trigger. The push paths are the
# fast path: a dependency change finds out on the PR, not next Monday.
#
# cargo-deny is fetched as a pinned, checksummed release binary rather than
# through a third-party action: this workflow is a supply-chain control, and
# the fewer moving parts execute inside it, the less there is to trust.
# Bumping the version below means updating BOTH lines — version and checksum
# (from the .sha256 file published next to the release tarball).
#
# Policy lives in deny.toml. The workspace gets the full check; the interop
# harness and the fuzz targets are unpublished tools with their own lockfiles,
# so only advisories apply to them (their license posture binds nobody).

on:
  schedule:
    # Weekly, Monday 05:23 UTC — deliberately off the busy top of the hour.
    - cron: "23 5 * * 1"
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "crates/interop/Cargo.lock"
      - "fuzz/Cargo.lock"
      - "fuzz/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  advisories:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install cargo-deny (pinned, checksummed)
        run: |
          set -euo pipefail
          curl -sSfL -o cargo-deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tgz" | sha256sum -c -
          tar -xzf cargo-deny.tgz
          install -m 0755 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" \
            /usr/local/bin/cargo-deny
          rm -rf cargo-deny.tgz "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"

      - name: Workspace — advisories, licenses, bans, sources
        run: cargo-deny check

      - name: Interop harness — advisories
        run: cargo-deny --manifest-path crates/interop/Cargo.toml --config deny.toml check advisories

      - name: Fuzz targets — advisories
        run: cargo-deny --manifest-path fuzz/Cargo.toml --config deny.toml check advisories
