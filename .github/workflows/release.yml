name: Release

# Publishes the four library crates to crates.io.
#
# Publishing is IRREVERSIBLE. crates.io yanks but never deletes, and a
# version number can never be reused. So this workflow is deliberately
# unhelpful about being run by accident:
#
#   * tag pushes publish; manual runs default to a dry run
#   * the tag must match the workspace version, or it stops
#   * the full acceptance suite runs against a real broker first, because
#     "cargo build succeeded" is not evidence that a release works
#   * it targets the `crates-io` environment, so a required reviewer can
#     be configured on it (repo Settings -> Environments)
#
# Two ways to authenticate, and which one you get is automatic:
#
#   * Trusted Publishing (OIDC, no stored secret) — preferred, used when
#     no CARGO_REGISTRY_TOKEN secret is set.
#   * CARGO_REGISTRY_TOKEN — needed for the FIRST publish of each crate.
#     crates.io cannot attach a Trusted Publisher to a crate that does not
#     exist yet (unlike PyPI there is no "pending publisher"), so the
#     initial release has to use a token. Afterwards, configure Trusted
#     Publishing per crate on crates.io, delete the secret, and this
#     workflow switches over on its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Required by crates-io-auth-action: it asks GitHub for an OIDC JWT
      # and exchanges it with crates.io for a 30-minute token.
      id-token: write
    env:
      # Fail safe: only a tag push, or a manual run with the box explicitly
      # unticked, publishes for real. Everything else is a dry run.
      #
      # Written as a double negative on purpose. GitHub expressions treat any
      # non-empty string as truthy, and a `workflow_dispatch` input arriving
      # as the string "false" — which is what `gh workflow run -f dry_run=false`
      # can send — would make a naive `&& inputs.dry_run` truthy and publish
      # when the caller asked not to. Comparing against both the boolean and
      # the string means the only way to reach a real upload is to ask for one.
      DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run != false && inputs.dry_run != 'false' }}
      # Secrets are not available in `if:` on some runner versions; hoist it.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag must match the workspace version
        # Read the version cargo actually resolved rather than grepping the
        # manifest, and assert all four crates agree — they inherit
        # `version.workspace`, so a mismatch means someone pinned one by
        # hand and the lockstep guarantee is already broken.
        run: |
          set -euo pipefail
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[]
                     | select(.name | test("^kafka-(conn|meta|admin|read)$"))
                     | .version' | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::published crates disagree on version:"; echo "$versions"
            exit 1
          fi
          echo "workspace version: $versions"
          echo "WORKSPACE_VERSION=$versions" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$versions" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version $versions"
              exit 1
            fi
            echo "tag ${GITHUB_REF_NAME} matches"
          fi

      - name: Gate — fmt, clippy, unit tests
        run: cargo xtask ci

      - name: Gate — acceptance suite against a real broker
        # PLAN.md makes these the acceptance criteria for every milestone.
        # Minutes rather than seconds, which is the correct trade for an
        # irreversible upload.
        run: |
          docker pull apache/kafka:4.3.1
          cargo xtask integration

      - name: Authenticate — Trusted Publishing
        id: auth
        # Skipped on a dry run: `cargo publish --dry-run` never contacts the
        # registry, and requesting a token would fail until every crate has a
        # Trusted Publisher configured — which would make the dry run
        # unusable at exactly the point it is most useful, before the first
        # real release.
        # `env.HAS_TOKEN`, not `secrets` — the `secrets` context is not
        # available in a step-level `if:`, and using it there is not a runtime
        # error but a *workflow validation* error: the run is created, fails in
        # zero seconds with no jobs and no logs, and `gh run view --log-failed`
        # reports only "log not found". Every push to main produced one of
        # these, so the release path had never once executed. `actionlint`
        # catches it in a second, which is why CI now runs it.
        #
        # The job-level `env:` above resolves this fine: `secrets` *is* an
        # allowed context there, and environment secrets are in scope because
        # the job declares `environment: crates-io`.
        if: ${{ env.HAS_TOKEN != 'true' && env.DRY_RUN != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        # `cargo publish --workspace` resolves the dependency order itself
        # (conn -> meta -> admin/read) and waits for each crate to appear in
        # the index before publishing its dependents, so no manual
        # sequencing or sleep is needed.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry run — packaging and verifying, nothing will be uploaded"
            cargo publish --workspace --dry-run
            exit 0
          fi
          # Fail here rather than letting cargo fail mid-upload with a less
          # obvious message: a real publish with no credential means either the
          # secret is missing or Trusted Publishing is not configured, and
          # partway through a four-crate publish is the worst place to find out.
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::no crates.io credential — set CARGO_REGISTRY_TOKEN on the crates-io environment, or configure Trusted Publishing for every crate"
            exit 1
          fi
          echo "::notice::publishing ${WORKSPACE_VERSION} to crates.io"
          cargo publish --workspace

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${WORKSPACE_VERSION}"
            echo
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Dry run — nothing uploaded."
            else
              echo "Published to crates.io:"
              for c in kafka-conn kafka-meta kafka-admin kafka-read; do
                echo "- [\`$c\`](https://crates.io/crates/$c/${WORKSPACE_VERSION})"
              done
            fi
            echo
            if [ "${HAS_TOKEN}" = "true" ]; then
              echo "_Authenticated with \`CARGO_REGISTRY_TOKEN\`. Once every crate"
              echo "exists on crates.io, configure Trusted Publishing per crate and"
              echo "delete the secret — this workflow will switch over automatically._"
            else
              echo "_Authenticated with Trusted Publishing (OIDC); no stored secret._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
