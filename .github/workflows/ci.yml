name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Self-hosted runners: `arc-runner-set-lib` is an ARC scale set on the
# kaas-rs k3s cluster (see Woestebanaan/k3s-cluster, apps/arc-runners).
#
# Jobs that can be triggered by a *fork* pull request must NOT land there.
# The runner pods are privileged DinD with a hostPath mount onto the node,
# and this repo is public — a fork PR is arbitrary code from a stranger.
# So `rust` and `docs`, the two jobs wired to `pull_request`, pick their
# runner per event: forks go to GitHub-hosted, everything else to ARC.
# The remaining jobs never run on `pull_request`, so a fork cannot reach
# them and they name the scale set directly. `integration` also runs on
# push to `main`, which is likewise unreachable from a fork: a push event
# requires write access, and the trigger above is branch-limited.
#
# `github.event.pull_request` is null for push/dispatch, so the expression
# falls through to ARC for those.

jobs:
  # fmt + clippy + unit tests. No Docker, no broker — this is the gate
  # that runs on every push.
  rust:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-runner-set-lib' }}
    steps:
      # The ARC runner image (ghcr.io/actions/actions-runner) is minimal:
      # no cc, gcc, ld, make or pkg-config. `ring` and other build-script
      # crates need a working C toolchain and linker. Verified absent by
      # probing the image directly; curl/unzip/tar/git ARE present, and
      # uid 1001 is in group 27(sudo) with passwordless sudo.
      # No-ops on ubuntu-latest, which already has cc.
      - name: Install C toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Before the toolchain, because it is seconds and catches a class of bug
      # nothing else here can. A workflow expression error is not a runtime
      # failure: GitHub creates the run, fails it in zero seconds with no jobs
      # and no logs, and `--log-failed` says only "log not found". release.yml
      # carried one — `secrets` in a step-level `if:` — from the day it was
      # written, so every push produced a red Release run and the publish path
      # had never once executed. Neither fmt, clippy nor any test could see it.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The ARC runners intermittently start a job with the toolchain
      # installed but not on PATH: `cargo: command not found` from a step whose
      # "Install Rust toolchain" reported success. It has hit `interop` and
      # `integration` on consecutive runs of the same unchanged workflow, and
      # it costs a full broker-booting run to discover.
      #
      # Re-export the directory explicitly rather than trusting PATH to be
      # inherited, and prove `cargo` runs *here*. A broken environment then
      # fails at setup with a legible message instead of as a bare exit 127
      # several minutes later, and a working one stops depending on which pod
      # the job landed on.
      - name: Put cargo on PATH, and prove it
        run: |
          set -eu
          for dir in "${CARGO_HOME:-$HOME/.cargo}/bin" "$HOME/.cargo/bin" /usr/local/cargo/bin; do
            if [ -x "$dir/cargo" ]; then
              printf '%s\n' "$dir" >> "$GITHUB_PATH"
              echo "cargo -> $dir"
              "$dir/cargo" --version
              exit 0
            fi
          done
          echo "::error::no cargo found (looked in CARGO_HOME, ~/.cargo, /usr/local/cargo)"
          exit 1

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (unit)
        run: cargo test --workspace

  # The `#[ignore]`d acceptance tests. Every one boots a real broker via
  # testcontainers, so this is minutes rather than seconds — but it runs on
  # every push to `main`, not on dispatch alone.
  #
  # It was dispatch-only from M0, with a comment promising to promote it
  # "once M0 lands and the runtime is known". Nineteen milestones later it
  # was still dispatch-only, so every push went green having run fmt,
  # clippy and unit tests and nothing else. The whole consumer suite —
  # M16 through M19 — had therefore never executed in CI, and the first
  # time it did was the v0.3.0 release gate: on a tag, minutes from an
  # irreversible publish. A gate nobody runs is not a gate.
  #
  # Not `pull_request`: that is the fork-safety line drawn above, and it
  # stays where it is.
  #
  # Docker comes from the ARC DinD sidecar, not the host: the pod sets
  # DOCKER_HOST=unix:///var/run/docker.sock and testcontainers picks it up
  # with no extra config. The sidecar is not ready the instant the runner
  # container starts, hence the wait below.
  integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: arc-runner-set-lib
    # Shared with release.yml's `acceptance`, which runs the identical
    # `cargo xtask integration`. A release is two pushes — the commit lands
    # on main, then the tag goes up — so without this the same tree boots two
    # full sets of brokers on the same scale set at once. That is not a
    # theoretical cost: it starved container boots and blew the testkit
    # two-minute deadline on whichever tests happened to be slowest, which
    # reads as three unrelated flakes rather than as one overloaded runner.
    #
    # The duplication itself stays. A tag can point at a tree this workflow
    # never saw, and "CI was green on some commit" is the wrong thing to
    # trust before an irreversible publish. They queue; neither is skipped.
    #
    # `cancel-in-progress: false` in both places on purpose: a cancelling
    # member would let a push to main kill a release's gate mid-run.
    concurrency:
      group: broker-suite
      cancel-in-progress: false
    steps:
      - name: Wait for Docker daemon (DinD sidecar)
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready after ${i}s"
              docker version
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon did not become ready"
          docker info || true
          exit 1

      - name: Install C toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The ARC runners intermittently start a job with the toolchain
      # installed but not on PATH: `cargo: command not found` from a step whose
      # "Install Rust toolchain" reported success. It has hit `interop` and
      # `integration` on consecutive runs of the same unchanged workflow, and
      # it costs a full broker-booting run to discover.
      #
      # Re-export the directory explicitly rather than trusting PATH to be
      # inherited, and prove `cargo` runs *here*. A broken environment then
      # fails at setup with a legible message instead of as a bare exit 127
      # several minutes later, and a working one stops depending on which pod
      # the job landed on.
      - name: Put cargo on PATH, and prove it
        run: |
          set -eu
          for dir in "${CARGO_HOME:-$HOME/.cargo}/bin" "$HOME/.cargo/bin" /usr/local/cargo/bin; do
            if [ -x "$dir/cargo" ]; then
              printf '%s\n' "$dir" >> "$GITHUB_PATH"
              echo "cargo -> $dir"
              "$dir/cargo" --version
              exit 0
            fi
          done
          echo "::error::no cargo found (looked in CARGO_HOME, ~/.cargo, /usr/local/cargo)"
          exit 1

      - name: Pre-pull the broker image
        run: docker pull apache/kafka:4.3.1

      - name: cargo test (integration)
        run: cargo xtask integration

  # `cargo-fuzz` needs nightly, so it gets its own job rather than pinning the
  # whole workspace. Rule 2 says a malformed record must not kill the process;
  # this is the executable form of that claim.
  fuzz:
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set-lib
    steps:
      # `cargo install cargo-fuzz` compiles from source, and libFuzzer needs
      # a linker — both require the C toolchain the ARC image lacks.
      #
      # g++ as well as gcc, and the guard tests for *both*. libFuzzer is C++:
      # `cargo fuzz build` drives cc-rs over libfuzzer/*.cpp, which fails as
      #   error occurred in cc-rs: failed to find tool "c++"
      # long after the Rust half has compiled cleanly. Guarding on `cc` alone
      # let a runner with a C compiler and no C++ one skip this step entirely
      # and fail in the build script instead.
      - name: Install C and C++ toolchain
        run: |
          if command -v cc >/dev/null 2>&1 && command -v c++ >/dev/null 2>&1; then
            echo "cc  → $(command -v cc)"
            echo "c++ → $(command -v c++)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc/c++, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc g++ libc6-dev pkg-config ca-certificates
          echo "cc  → $(command -v cc || echo MISSING)"
          echo "c++ → $(command -v c++ || echo MISSING)"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The ARC runners intermittently start a job with the toolchain
      # installed but not on PATH: `cargo: command not found` from a step whose
      # "Install Rust toolchain" reported success. It has hit `interop` and
      # `integration` on consecutive runs of the same unchanged workflow, and
      # it costs a full broker-booting run to discover.
      #
      # Re-export the directory explicitly rather than trusting PATH to be
      # inherited, and prove `cargo` runs *here*. A broken environment then
      # fails at setup with a legible message instead of as a bare exit 127
      # several minutes later, and a working one stops depending on which pod
      # the job landed on.
      - name: Put cargo on PATH, and prove it
        run: |
          set -eu
          for dir in "${CARGO_HOME:-$HOME/.cargo}/bin" "$HOME/.cargo/bin" /usr/local/cargo/bin; do
            if [ -x "$dir/cargo" ]; then
              printf '%s\n' "$dir" >> "$GITHUB_PATH"
              echo "cargo -> $dir"
              "$dir/cargo" --version
              exit 0
            fi
          done
          echo "::error::no cargo found (looked in CARGO_HOME, ~/.cargo, /usr/local/cargo)"
          exit 1

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the record batch decoder
        # `+nightly` explicitly: rust-toolchain.toml pins 1.97.1, and that
        # pin wins over the nightly this job just installed. Without it,
        # cargo-fuzz builds with stable and dies on "the option `Z` is only
        # accepted on the nightly compiler". `cargo xtask fuzz` already does
        # this; the workflow was calling cargo directly and did not.
        run: cargo +nightly fuzz run --fuzz-dir fuzz record_batch -- -max_total_time=300

  # The documentation book. Runs on every push: a broken cross-reference is
  # cheap to catch here and expensive to notice as a 404 after publish.
  #
  # mdbook stays on the 0.4.x line. mdbook-linkcheck 0.7.7 and
  # mdbook-mermaid >= 0.17.0 target different mdbook major lines — 0.17.0 is
  # built against mdbook 0.5's preprocessor protocol and fails against 0.4 —
  # so 0.16.2 is the newest mermaid preprocessor that works here. Bump all
  # three together when moving to mdbook 0.5. Keep these pins in lockstep
  # with docs-publish.yml.
  #
  # No toolchain step: the three tools are pinned release binaries, and the
  # ARC image already has curl, unzip and tar (verified by probing it).
  docs:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-runner-set-lib' }}
    env:
      MDBOOK_VERSION: v0.4.52
      MDBOOK_MERMAID_VERSION: v0.16.2
      MDBOOK_LINKCHECK_VERSION: v0.7.7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mdbook + mdbook-mermaid + mdbook-linkcheck (pinned)
        # Pinned release binaries via curl rather than `cargo install`:
        # minutes faster on a cold runner, and the versions are exact.
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL -o /tmp/mdbook-linkcheck.zip \
            "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/${MDBOOK_LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          unzip -o -d "$HOME/.local/bin" /tmp/mdbook-linkcheck.zip mdbook-linkcheck
          chmod +x "$HOME/.local/bin/mdbook-linkcheck"

      - name: mdbook build (html + linkcheck backends)
        run: mdbook build docs

      - name: Every crates/ path cited in the book must exist
        # The book cites module paths heavily. Without this a refactor that
        # moves a file leaves a citation that is confidently wrong, which is
        # worse than no citation at all.
        # Read line by line rather than word-splitting a command substitution:
        # the regex happens to exclude spaces, so the loop worked, but it is
        # one permissive character away from silently splitting a path in two
        # and reporting both halves as missing.
        run: |
          missing=0
          while IFS= read -r path; do
            if [ ! -e "$path" ]; then
              echo "::error::docs cite a path that does not exist: $path"
              missing=1
            fi
          done < <(grep -rhoE '\bcrates/[A-Za-z0-9_./-]+\.rs\b' docs/src | sort -u)
          exit $missing

  # Cross-client interop against rdkafka. Needs cmake and a C toolchain to
  # build librdkafka, which is why it is neither in the workspace nor in `ci`.
  interop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set-lib
    steps:
      - name: Wait for Docker daemon (DinD sidecar)
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready after ${i}s"
              docker version
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon did not become ready"
          docker info || true
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The ARC runners intermittently start a job with the toolchain
      # installed but not on PATH: `cargo: command not found` from a step whose
      # "Install Rust toolchain" reported success. It has hit `interop` and
      # `integration` on consecutive runs of the same unchanged workflow, and
      # it costs a full broker-booting run to discover.
      #
      # Re-export the directory explicitly rather than trusting PATH to be
      # inherited, and prove `cargo` runs *here*. A broken environment then
      # fails at setup with a legible message instead of as a bare exit 127
      # several minutes later, and a working one stops depending on which pod
      # the job landed on.
      - name: Put cargo on PATH, and prove it
        run: |
          set -eu
          for dir in "${CARGO_HOME:-$HOME/.cargo}/bin" "$HOME/.cargo/bin" /usr/local/cargo/bin; do
            if [ -x "$dir/cargo" ]; then
              printf '%s\n' "$dir" >> "$GITHUB_PATH"
              echo "cargo -> $dir"
              "$dir/cargo" --version
              exit 0
            fi
          done
          echo "::error::no cargo found (looked in CARGO_HOME, ~/.cargo, /usr/local/cargo)"
          exit 1

      # librdkafka needs cmake *and* a C toolchain; the ARC image has
      # neither. `sudo` exists there (uid 1001 is in group 27), but guard
      # anyway so the step is portable back to a root or hosted runner.
      #
      # libcurl headers too. `rdkafka-sys` configures librdkafka with
      # `-DWITH_CURL=0` and the build still stops at
      #   rdkafka_conf.c:60:10: fatal error: curl/curl.h: No such file
      # so the include is not fully guarded by that switch on the 2.12.1
      # bundled source. Supplying the header is a one-package fix; chasing the
      # right combination of upstream feature flags is not.
      # clang too: the `zstd` feature on rdkafka pulls in zstd-sys, which
      # generates its bindings with bindgen and dies on
      #   Unable to find libclang
      # without it. The feature is not optional — see the comment on the
      # rdkafka dependency in crates/interop/Cargo.toml.
      #
      # libssl-dev and pkg-config are load-bearing rather than incidental:
      # librdkafka needs OpenSSL for SCRAM's and OAUTHBEARER's HMAC, so the
      # `ssl` feature — and therefore tests/sasl_interop.rs, the only
      # cross-client check of authentication there is — fails at cmake
      # configure time without them. openssl-sys finds the library through
      # pkg-config and reports the absence as "could not find OpenSSL".
      - name: Install cmake + C toolchain + libcurl and libclang
        run: |
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::not root and no sudo — cannot install cmake"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            cmake make gcc g++ libc6-dev pkg-config ca-certificates \
            libcurl4-openssl-dev libssl-dev clang libclang-dev
          echo "cc → $(command -v cc || echo MISSING)"
          echo "cmake → $(command -v cmake || echo MISSING)"
          curl_h=$(find /usr/include -path '*/curl/curl.h' -print -quit 2>/dev/null)
          echo "curl.h → ${curl_h:-MISSING}"
          libclang=$(find /usr/lib -name 'libclang.so*' -print -quit 2>/dev/null)
          echo "libclang → ${libclang:-MISSING}"

      - name: Pre-pull the broker image
        run: docker pull apache/kafka:4.3.1

      - name: cargo xtask interop
        run: cargo xtask interop
