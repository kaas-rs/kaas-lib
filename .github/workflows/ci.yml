name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Self-hosted runners: `arc-runner-set-lib` is an ARC scale set on the
# kaas-rs k3s cluster (see Woestebanaan/k3s-cluster, apps/arc-runners).
#
# Jobs that can be triggered by a *fork* pull request must NOT land there.
# The runner pods are privileged DinD with a hostPath mount onto the node,
# and this repo is public — a fork PR is arbitrary code from a stranger.
# So `rust` and `docs`, the two jobs wired to `pull_request`, pick their
# runner per event: forks go to GitHub-hosted, everything else to ARC.
# The remaining jobs are `workflow_dispatch`-only and can't be reached by
# a fork at all, so they name the scale set directly.
#
# `github.event.pull_request` is null for push/dispatch, so the expression
# falls through to ARC for those.

jobs:
  # fmt + clippy + unit tests. No Docker, no broker — this is the gate
  # that runs on every push.
  rust:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-runner-set-lib' }}
    steps:
      # The ARC runner image (ghcr.io/actions/actions-runner) is minimal:
      # no cc, gcc, ld, make or pkg-config. `ring` and other build-script
      # crates need a working C toolchain and linker. Verified absent by
      # probing the image directly; curl/unzip/tar/git ARE present, and
      # uid 1001 is in group 27(sudo) with passwordless sudo.
      # No-ops on ubuntu-latest, which already has cc.
      - name: Install C toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"

      - uses: actions/checkout@v6

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (unit)
        run: cargo test --workspace

  # The `#[ignore]`d acceptance tests. Every one boots a real broker via
  # testcontainers, so this is minutes rather than seconds — manual for
  # now. Promote it to `push` once M0 lands and the runtime is known.
  #
  # Docker comes from the ARC DinD sidecar, not the host: the pod sets
  # DOCKER_HOST=unix:///var/run/docker.sock and testcontainers picks it up
  # with no extra config. The sidecar is not ready the instant the runner
  # container starts, hence the wait below.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set-lib
    steps:
      - name: Wait for Docker daemon (DinD sidecar)
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready after ${i}s"
              docker version
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon did not become ready"
          docker info || true
          exit 1

      - name: Install C toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"

      - uses: actions/checkout@v6

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pre-pull the broker image
        run: docker pull apache/kafka:4.3.1

      - name: cargo test (integration)
        run: cargo xtask integration

  # `cargo-fuzz` needs nightly, so it gets its own job rather than pinning the
  # whole workspace. Rule 2 says a malformed record must not kill the process;
  # this is the executable form of that claim.
  fuzz:
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set-lib
    steps:
      # `cargo install cargo-fuzz` compiles from source, and libFuzzer needs
      # a linker — both require the C toolchain the ARC image lacks.
      - name: Install C toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"

      - uses: actions/checkout@v6

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the record batch decoder
        run: cargo fuzz run --fuzz-dir fuzz record_batch -- -max_total_time=300

  # The documentation book. Runs on every push: a broken cross-reference is
  # cheap to catch here and expensive to notice as a 404 after publish.
  #
  # mdbook stays on the 0.4.x line. mdbook-linkcheck 0.7.7 and
  # mdbook-mermaid >= 0.17.0 target different mdbook major lines — 0.17.0 is
  # built against mdbook 0.5's preprocessor protocol and fails against 0.4 —
  # so 0.16.2 is the newest mermaid preprocessor that works here. Bump all
  # three together when moving to mdbook 0.5. Keep these pins in lockstep
  # with docs-publish.yml.
  #
  # No toolchain step: the three tools are pinned release binaries, and the
  # ARC image already has curl, unzip and tar (verified by probing it).
  docs:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-runner-set-lib' }}
    env:
      MDBOOK_VERSION: v0.4.52
      MDBOOK_MERMAID_VERSION: v0.16.2
      MDBOOK_LINKCHECK_VERSION: v0.7.7
    steps:
      - uses: actions/checkout@v6

      - name: Install mdbook + mdbook-mermaid + mdbook-linkcheck (pinned)
        # Pinned release binaries via curl rather than `cargo install`:
        # minutes faster on a cold runner, and the versions are exact.
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL -o /tmp/mdbook-linkcheck.zip \
            "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/${MDBOOK_LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          unzip -o -d "$HOME/.local/bin" /tmp/mdbook-linkcheck.zip mdbook-linkcheck
          chmod +x "$HOME/.local/bin/mdbook-linkcheck"

      - name: mdbook build (html + linkcheck backends)
        run: mdbook build docs

      - name: Every crates/ path cited in the book must exist
        # The book cites module paths heavily. Without this a refactor that
        # moves a file leaves a citation that is confidently wrong, which is
        # worse than no citation at all.
        run: |
          missing=0
          for path in $(grep -rhoE '\bcrates/[A-Za-z0-9_./-]+\.rs\b' docs/src | sort -u); do
            if [ ! -e "$path" ]; then
              echo "::error::docs cite a path that does not exist: $path"
              missing=1
            fi
          done
          exit $missing

  # Cross-client interop against rdkafka. Needs cmake and a C toolchain to
  # build librdkafka, which is why it is neither in the workspace nor in `ci`.
  interop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set-lib
    steps:
      - name: Wait for Docker daemon (DinD sidecar)
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready after ${i}s"
              docker version
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon did not become ready"
          docker info || true
          exit 1

      - uses: actions/checkout@v6

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # librdkafka needs cmake *and* a C toolchain; the ARC image has
      # neither. `sudo` exists there (uid 1001 is in group 27), but guard
      # anyway so the step is portable back to a root or hosted runner.
      - name: Install cmake + C toolchain
        run: |
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::not root and no sudo — cannot install cmake"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            cmake gcc g++ libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"
          echo "cmake → $(command -v cmake || echo MISSING)"

      - name: Pre-pull the broker image
        run: docker pull apache/kafka:4.3.1

      - name: cargo xtask interop
        run: cargo xtask interop
